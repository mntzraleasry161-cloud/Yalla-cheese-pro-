<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصدير وحوش الشطرنج</title>
<style>
  body { background-color: #151126; color: white; text-align: center; font-family: sans-serif; margin-top: 50px; }
  h1 { color: #ffd66b; }
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>
</head>
<body>

<h1 id="msg">جاري تصدير المجسمات... انتظر قليلاً</h1>
<p style="color:#aaa;">إذا منعتك الصفحة من التنزيل، اضغط على "السماح" (Allow multiple downloads)</p>

<script type="module">
import * as THREE from "three";
import { OBJExporter } from "three/addons/exporters/OBJExporter.js";

// --- دالة تصميم الوحوش من كودك ---
function monster(type,color){
 const g=new THREE.Group();
 const main=new THREE.MeshStandardMaterial({color:color==="w"?0x28bca7:0x8552c9,roughness:.4,metalness:.1});
 const gold=new THREE.MeshStandardMaterial({color:0xffc857,metalness:.6,roughness:.3});
 const white=new THREE.MeshStandardMaterial({color:0xffffff});
 const black=new THREE.MeshStandardMaterial({color:0x151515});

 function sphere(x,y,z,sx,sy,sz,mat){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),mat);
  m.position.set(x,y,z); m.scale.set(sx,sy,sz); g.add(m);
 }
 function cone(x,y,z,size,mat){
  const m=new THREE.Mesh(new THREE.ConeGeometry(size,.4,12),mat);
  m.position.set(x,y,z); g.add(m);
 }

 sphere(0,.45,0,.34,.45,.32,main);
 sphere(0,.92,0,.34,.35,.32,main);

 for(const x of [-.14,.14]){
  sphere(x,.99,.28,.105,.12,.06,white);
  sphere(x,1,.33,.045,.06,.035,black);
 }
 for(const x of [-.38,.38]){
  sphere(x,.48,0,.12,.2,.13,main);
 }
 if(type==="k"){
  cone(-.23,1.35,0,.16,gold);
  cone(.23,1.35,0,.16,gold);
  sphere(0,1.38,0,.32,.13,.3,gold);
 }
 if(type==="q"){
  for(let i=-1;i<=1;i++)cone(i*.2,1.35,0,.13,gold);
  sphere(0,1.35,0,.3,.1,.3,gold);
 }
 if(type==="r"){
  const crown=new THREE.Mesh(new THREE.CylinderGeometry(.3,.38,.25,8),gold);
  crown.position.y=1.3; g.add(crown);
 }
 if(type==="b"){ cone(0,1.4,0,.16,gold); }
 if(type==="n"){
  sphere(0,1.05,.3,.15,.2,.3,gold);
  cone(.1,1.35,0,.13,gold);
 }
 if(type==="p"){ sphere(0,1.3,0,.15,.16,.15,gold); }
 return g;
}

// --- دالة التصدير ---
const exporter = new OBJExporter();
const types = ['p', 'n', 'b', 'r', 'q', 'k'];
const colors = ['w', 'b'];
const typeNames = {p:'Pawn', n:'Knight', b:'Bishop', r:'Rook', q:'Queen', k:'King'};
const colorNames = {w:'White', b:'Purple'};

async function downloadModels() {
    let count = 0;
    for (let c of colors) {
        for (let t of types) {
            const model = monster(t, c);
            const result = exporter.parse(model);
            const blob = new Blob([result], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `Monster_${colorNames[c]}_${typeNames[t]}.obj`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            count++;
            document.getElementById("msg").innerText = `تم تصدير ${count} من 12...`;
            
            // تأخير بسيط بين كل تنزيل حتى لا يمنع المتصفح التنزيلات المتعددة
            await new Promise(r => setTimeout(r, 600));
        }
    }
    document.getElementById("msg").innerText = "✅ اكتمل التصدير! روح لملفات التنزيلات.";
}

// بدء التصدير
downloadModels();
</script>
</body>
</html>
