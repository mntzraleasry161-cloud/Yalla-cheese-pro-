<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monster Chess 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
 margin:0;
 background:radial-gradient(circle at top,#44205e,#160e29 65%,#090b18);
 color:white;
 font-family:Cairo,Arial,sans-serif;
 text-align:center;
 min-height:100vh;
}

header{
 padding:20px 10px 12px;
 background:linear-gradient(135deg,#301647,#17132c);
 border-bottom:2px solid #d4af37;
 box-shadow:0 5px 25px #0009;
}

h1{
 margin:0;
 font-size:clamp(23px,6vw,38px);
 color:#ffd66b;
 text-shadow:0 0 15px #ffba35;
}

.subtitle{
 color:#d8b7f0;
 font-size:13px;
}

/* ===== قائمة اللاعب ===== */
.player-bar{
 display:flex;
 align-items:center;
 gap:12px;
 max-width:700px;
 margin:16px auto 0;
 padding:10px 14px;
 border-radius:16px;
 background:linear-gradient(145deg,#ffffff12,#ffffff04);
 border:1px solid #a77bba33;
 cursor:pointer;
 transition:.2s;
}
.player-bar:hover{border-color:#d4af3766}
.player-bar .avatar{
 width:44px;height:44px;border-radius:50%;
 display:grid;place-items:center;font-size:20px;
 background:linear-gradient(145deg,#8552c9,#3a1b57);
 border:2px solid #d4af37;
 box-shadow:0 0 14px #d4af3755;
}
.player-bar .pinfo{text-align:right;flex:1;line-height:1.2}
.player-bar .pinfo b{font-size:13px;display:block}
.player-bar .xpbar{width:100%;max-width:120px;height:4px;border-radius:9px;background:#ffffff1a;overflow:hidden;margin-top:4px}
.player-bar .xpbar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#c18b16,#fff8d8);box-shadow:0 0 8px #ffd66b}
.player-bar .coins{display:flex;flex-direction:column;gap:3px}
.player-bar .coins span{font-size:10px;font-weight:800;color:#ffd66b;background:#ffffff0f;border:1px solid #ffd66b33;border-radius:8px;padding:1px 7px;white-space:nowrap}

/* ===== الأقسام ===== */
.section{
 width:min(95%,700px);
 margin:18px auto;
 padding:18px 14px;
 border:1px solid #a77bba66;
 border-radius:22px;
 background:linear-gradient(145deg,#ffffff12,#ffffff04);
 box-shadow:0 10px 35px #0007,inset 0 0 20px #9b59b622;
}

.section-title{
 color:#ffd66b;
 font-size:16px;
 font-weight:900;
 margin:6px 0 14px;
 text-shadow:0 0 10px #d4af37;
}

/* ===== أزرار الأوضاع ===== */
.mode-btn{
 width:100%;
 display:flex;
 align-items:center;
 gap:14px;
 padding:14px 18px;
 border-radius:16px;
 border:2px solid #f3d06e;
 background:linear-gradient(#ffe477,#c18b16 60%,#80530a);
 color:#3b2200;
 font-family:inherit;
 font-weight:900;
 cursor:pointer;
 transition:.15s;
 box-shadow:inset 0 3px 5px #ffffff66,inset 0 -5px 8px #0007,0 6px 12px #0008;
 margin-bottom:10px;
 text-align:right;
}
.mode-btn:hover{filter:brightness(1.1)}
.mode-btn:active{transform:translateY(3px);box-shadow:inset 0 3px 10px #000a}
.mode-btn .icon{font-size:28px;filter:drop-shadow(0 0 6px #00000044)}
.mode-btn .text{flex:1;line-height:1.35}
.mode-btn .text b{display:block;font-size:15px}
.mode-btn .text small{display:block;font-size:11px;font-weight:600;opacity:.75}

.mode-btn.secondary{
 background:linear-gradient(#c37ad7,#7435a4,#38145d);
 color:#fff;
}
.mode-btn.blue{
 background:linear-gradient(#55baff,#2377b9,#12416e);
 color:#fff;
}
.mode-btn.green{
 background:linear-gradient(#42e99a,#17945b,#07502f);
 color:#fff;
}

/* ===== شبكة المملكة ===== */
.kingdom-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
 gap:10px;
}
.kingdom-tile{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:6px;
 padding:14px 6px;
 border-radius:16px;
 background:linear-gradient(150deg,#ffffff0d,#ffffff02);
 border:1px solid #a77bba2e;
 color:#fff;
 font-family:inherit;
 font-size:11.5px;
 font-weight:700;
 cursor:pointer;
 transition:.2s;
}
.kingdom-tile span{font-size:24px}
.kingdom-tile:hover{border-color:#d4af3766;transform:translateY(-3px);background:#ffffff12}

/* ===== شاشة اللعب ===== */
#gameScreen{display:none}

#game{
 width:100%;
 height:55vh;
 min-height:340px;
 max-height:620px;
 touch-action:none;
 overflow:hidden;
 border-radius:15px;
}

#game canvas{display:block}

.game-panel{
 width:min(96%,800px);
 margin:15px auto;
 padding:13px;
 background:#211632;
 border:1px solid #a77bba77;
 border-radius:18px;
}

#status{
 color:#8ee7ff;
 font-weight:900;
 font-size:16px;
 margin:10px;
}

#moves{
 max-height:65px;
 overflow:auto;
 color:#ddd;
 font-size:12px;
 overflow-wrap:anywhere;
 margin-top:12px;
}

select{
 background:#302044;
 color:white;
 border:1px solid #d4af37;
 border-radius:10px;
 padding:10px;
 font-family:inherit;
 font-weight:bold;
}

.btn{
 position:relative;
 overflow:hidden;
 cursor:pointer;
 border:2px solid #f3d06e;
 border-radius:13px;
 min-width:135px;
 padding:13px 18px;
 color:white;
 font-family:inherit;
 font-weight:900;
 font-size:15px;
 text-shadow:0 2px 4px #0009;
 box-shadow:inset 0 3px 5px #ffffff66,inset 0 -5px 8px #0007,0 6px 12px #0008;
 transition:.15s;
}
.btn:before{
 content:"";
 position:absolute;
 top:0;
 left:10%;
 width:80%;
 height:45%;
 background:linear-gradient(#ffffff55,transparent);
 border-radius:0 0 50% 50%;
 pointer-events:none;
}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 8px #0009}

.gold{background:linear-gradient(#ffe477,#c18b16,#80530a);color:#3b2200}
.green{background:linear-gradient(#42e99a,#17945b,#07502f)}
.purple{background:linear-gradient(#c37ad7,#7435a4,#38145d)}
.blue{background:linear-gradient(#55baff,#2377b9,#12416e)}
.red{background:linear-gradient(#ff6868,#c52727,#750c0c)}

.small{min-width:110px;font-size:13px;padding:10px}

.buttons{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:12px;
}

#promotion{
 display:none;
 padding:12px;
 background:#37244d;
 border-radius:12px;
 margin:10px;
}

/* ===== النوافذ المنبثقة ===== */
#settings,
#difficultyModal{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 justify-content:center;
 align-items:center;
 padding:15px;
 backdrop-filter:blur(6px);
}
#settings.show,
#difficultyModal.show{display:flex}

.modal{
 width:min(95%,420px);
 background:linear-gradient(145deg,#49245e,#1a102b);
 border:2px solid #d4af37;
 border-radius:20px;
 padding:22px;
 box-shadow:0 0 35px #000;
 text-align:right;
}

.modal h2{
 color:#ffd66b;
 margin:0 0 16px;
 text-align:center;
 font-size:20px;
}

.setting-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #ffffff22;
}
.setting-row:last-of-type{border-bottom:none}

input[type=checkbox]{width:22px;height:22px;accent-color:#d4af37}

.diff-option{
 width:100%;
 display:flex;
 align-items:center;
 gap:12px;
 padding:14px 16px;
 margin-bottom:10px;
 border-radius:14px;
 border:2px solid #d4af37;
 background:linear-gradient(145deg,#3f1f57,#1a1030);
 color:#fff;
 font-family:inherit;
 font-weight:700;
 font-size:14px;
 cursor:pointer;
 transition:.15s;
 text-align:right;
}
.diff-option:hover{filter:brightness(1.15);transform:translateX(-4px)}
.diff-option .ic{font-size:22px}

/* ===== إشعار Toast ===== */
#notice{
 position:fixed;
 left:50%;
 bottom:28px;
 transform:translate(-50%,20px);
 background:linear-gradient(145deg,#3f1f57,#1a1030);
 border:1px solid #d4af37;
 color:#ffd66b;
 padding:12px 22px;
 border-radius:999px;
 font-size:13px;
 font-weight:800;
 box-shadow:0 10px 30px #000a;
 opacity:0;
 pointer-events:none;
 transition:.3s;
 z-index:99;
 white-space:nowrap;
 max-width:90vw;
 overflow:hidden;
 text-overflow:ellipsis;
}
#notice.show{opacity:1;transform:translate(-50%,0)}

.footer{
 color:#a995b9;
 font-size:11px;
 padding:15px;
 text-align:center;
}

/* ===== شاشة KOKTON ===== */
#splash{
 position:fixed;
 inset:0;
 z-index:9999;
 background:#000;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 opacity:1;
 transition:opacity 1s ease;
}
#splash.hide{opacity:0;pointer-events:none}

#splash .splash-vignette{
 position:absolute;
 inset:0;
 background:radial-gradient(circle at center,#2a1245 0%,#0a0512 55%,#000 100%);
}
#splash .splash-rays{
 position:absolute;
 width:150vmax;
 height:150vmax;
 background:conic-gradient(from 0deg,
   transparent 0deg,
   rgba(255,214,107,0.12) 15deg,
   transparent 30deg,
   transparent 90deg,
   rgba(255,214,107,0.09) 105deg,
   transparent 120deg,
   transparent 180deg,
   rgba(255,214,107,0.12) 195deg,
   transparent 210deg,
   transparent 270deg,
   rgba(255,214,107,0.09) 285deg,
   transparent 300deg);
 opacity:0;
 animation:raysIn 1.6s ease 0.3s forwards, spin 22s linear infinite;
}
@keyframes raysIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

.company-wrap{
 position:relative;
 z-index:2;
 display:flex;
 justify-content:center;
}

#splash .company{
 margin:0;
 font-size:clamp(48px,15vw,120px);
 font-weight:900;
 letter-spacing:16px;
 padding:0 10px;
 background:linear-gradient(180deg,#fff8d8 0%,#ffd66b 30%,#8a5c04 50%,#ffd66b 70%,#fff8d8 100%);
 -webkit-background-clip:text;
 background-clip:text;
 -webkit-text-fill-color:transparent;
 color:transparent;
 opacity:0;
 transform:scale(0.4);
 filter:blur(14px) drop-shadow(0 0 30px #ffba35aa) drop-shadow(0 0 60px #d4af3766);
 animation:companyIn 1.4s cubic-bezier(.2,.9,.3,1.1) 0.2s forwards;
}
@keyframes companyIn{
 0%  {opacity:0; transform:scale(0.4); filter:blur(14px);}
 60% {opacity:1; transform:scale(1.08); filter:blur(0);}
 100%{opacity:1; transform:scale(1);   filter:blur(0);}
}

.company-shine{
 position:absolute;
 top:0;
 left:-100%;
 width:55%;
 height:100%;
 background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,0.9) 50%,transparent 80%);
 mix-blend-mode:overlay;
 pointer-events:none;
 animation:shine 2.6s ease 1.6s infinite;
}
@keyframes shine{
 0%  {left:-100%;}
 40% {left:150%;}
 100%{left:150%;}
}

#splash .tagline{
 margin-top:22px;
 color:#e8d4ff;
 font-size:clamp(11px,3vw,16px);
 font-weight:700;
 letter-spacing:14px;
 opacity:0;
 transform:translateY(10px);
 z-index:2;
 animation:tagIn 0.9s ease 1.4s forwards;
}
@keyframes tagIn{to{opacity:1; transform:translateY(0);}}

.splash-loader{
 margin-top:38px;
 width:180px;
 height:3px;
 background:rgba(255,255,255,0.1);
 border-radius:2px;
 overflow:hidden;
 z-index:2;
 opacity:0;
 animation:tagIn 0.6s ease 1.8s forwards;
}
.splash-loader > div{
 width:0;
 height:100%;
 background:linear-gradient(90deg,#ffd66b,#fff8d8);
 box-shadow:0 0 10px #ffd66b;
 animation:load 1.4s ease 1.9s forwards;
}
@keyframes load{to{width:100%;}}
</style>
</head>

<body>

<!-- ===== شاشة KOKTON ===== -->
<div id="splash">
 <div class="splash-vignette"></div>
 <div class="splash-rays"></div>

 <div class="company-wrap">
   <div class="company">KOKTON</div>
   <div class="company-shine"></div>
 </div>

 <div class="tagline">PRESENTS</div>
 <div class="splash-loader"><div></div></div>
</div>

<!-- ===== القائمة الرئيسية ===== -->
<div id="menuScreen">

<header>
<h1>🐉 MONSTER CHESS 3D</h1>
<div class="subtitle">مملكة الوحوش الأسطورية ⚔️</div>
</header>

<!-- حساب اللاعب -->
<div class="player-bar" onclick="comingSoon('الملف الشخصي')">
 <div class="avatar">👑</div>
 <div class="pinfo">
   <b>قائد المملكة</b>
   <div class="xpbar"><i></i></div>
 </div>
 <div class="coins">
   <span>🪙 1,250</span>

 </div>
</div>

<!-- أوضاع اللعب -->
<div class="section">

 <button class="mode-btn" onclick="openDifficulty()">
   <span class="icon">🤖</span>
   <span class="text">
     <b>ضد الكمبيوتر</b>
     <small>واجه الذكاء الاصطناعي</small>
   </span>
 </button>

 <button class="mode-btn secondary" onclick="comingSoon('اللعب أونلاين')">
   <span class="icon">🌐</span>
   <span class="text">
     <b>اللعب أونلاين</b>
     <small>تحدَّ لاعبين حقيقيين</small>
   </span>
 </button>

 <button class="mode-btn blue" onclick="comingSoon('الألغاز')">
   <span class="icon">🧩</span>
   <span class="text">
     <b>الألغاز</b>
     <small>حلّ ألغاز الشطرنج</small>
   </span>
 </button>

 <button class="mode-btn green" onclick="comingSoon('البطولات')">

 </button>
</div>

<!-- المملكة -->
<div class="section">
 <div class="section-title">✨ المملكة</div>
 <div class="kingdom-grid">
   <button class="kingdom-tile" onclick="comingSoon('المتجر')"><span>🛒</span>المتجر</button>
   <button class="kingdom-tile" onclick="comingSoon('الترتيب')"><span>🏅</span>الترتيب</button>
   <button class="kingdom-tile" onclick="comingSoon('الإنجازات')"><span>🎖️</span>الإنجازات</button>
   <button class="kingdom-tile" onclick="comingSoon('المهام')"><span>📜</span>المهام</button>
   <button class="kingdom-tile" onclick="comingSoon('الملف الشخصي')"><span>👤</span>ملفي</button>
   <button class="kingdom-tile" onclick="openSettings()"><span>⚙️</span>الإعدادات</button>
 </div>
</div>

<div class="footer">صُنع بـ ❤️ في مملكة KOKTON · جميع الحقوق محفوظة © 2025</div>
</div>

<!-- ===== شاشة اللعب ===== -->
<div id="gameScreen">

<div class="game-panel">
 <div class="buttons">
   <select id="level">
     <option value="easy">🟢 سهل</option>
     <option value="medium">🔵 متوسط</option>

   <button class="btn gold small" onclick="newGame()">🔄 لعبة جديدة</button>

</div>

<div id="game"></div>

<div class="game-panel">
 <div id="status">دورك الآن - الأبيض</div>

   </div>
 </div>

 <div id="moves">سجل الحركات سيظهر هنا</div>
</div>

</div>

<!-- ===== نافذة اختيار الصعوبة ===== -->
<div id="difficultyModal">
 <div class="modal">
   <h2>⚔️ اختر مستوى الصعوبة</h2>

   <button class="diff-option" onclick="pickDifficulty('easy')">
     <span class="ic">🟢</span>
     <span>سهل — للمبتدئين</span>

   <button class="diff-option" onclick="pickDifficulty('medium')">
     <span class="ic">🔵</span>

</div>

<!-- ===== الإعدادات ===== -->
<div id="settings">
 <div class="modal">
   <h2>⚙️ الإعدادات</h2>

   <div class="setting-row">
     <span>🔊 أصوات النقر</span>
     <input type="checkbox" id="sound" checked>
   </div>

   <div class="setting-row">
     <span>✨ مؤثرات الحركة</span>
     <input type="checkbox" id="effects" checked>
   </div>

   <div class="buttons" style="margin-top:18px">
     <button class="btn green small" onclick="closeSettings()">حفظ وإغلاق</button>
   </div>

</div>

<!-- ===== إشعار Toast ===== -->
<div id="notice"></div>

 if(!s) return;
 s.classList.add("hide");
 setTimeout(function(){s.remove();}, 1000);

<!-- استيراد المكتبات -->
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Chess } from "chess";

/* ============ حالة اللعبة ============ */
const chess = new Chess();
const holder = document.getElementById("game");

let selected = null;
let thinking = false;
let pendingPromotion = null;
let snapshots = [];
let gameStarted = false;
let initialized = false;

const files = "abcdefgh";

/* ============ أدوات مساعدة ============ */
function position(square){
 return {
  x: files.indexOf(square[0]) - 3.5,
  z: Number(square[1]) - 4.5
 };
}

function sound(){
 if(!document.getElementById("sound").checked) return;
 try{
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  const ctx = new AC();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = 650;
  gain.gain.setValueAtTime(.07, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .12);
  osc.start();
  osc.stop(ctx.currentTime + .12);
  osc.onended = () => { try{ ctx.close(); }catch(e){} };
 }catch(e){}
}

function notice(msg){
 const t = document.getElementById("notice");
 t.textContent = msg;
 t.classList.add("show");
 clearTimeout(t._timer);
 t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============ نافذة الإعدادات والصعوبة ============ */
window.openSettings = function(){
 sound();
 document.getElementById("settings").classList.add("show");
};
window.closeSettings = function(){
 sound();
 document.getElementById("settings").classList.remove("show");
};
window.openDifficulty = function(){
 sound();
 document.getElementById("difficultyModal").classList.add("show");
};
window.closeDifficulty = function(){
 sound();
 document.getElementById("difficultyModal").classList.remove("show");
};
window.pickDifficulty = function(level){
 closeDifficulty();
 window.startGame(level);
};

window.comingSoon = function(name){
 sound();
 notice("✨ " + name + " — قريباً في تحديث جديد!");
};

/* ============ إعداد three.js ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151126);

const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
camera.position.set(7, 9, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2.15;

scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const floor = new THREE.Mesh(
 new THREE.PlaneGeometry(200, 200),
 new THREE.MeshStandardMaterial({ color: 0x101020 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -.7;
scene.add(floor);

/* قاعدة الشطرنج */
const base = new THREE.Mesh(
 new THREE.BoxGeometry(8.7, .65, 8.7),
 new THREE.MeshStandardMaterial({ color: 0x29213e, metalness: .5, roughness: .35 })
);
base.position.y = -.4;
base.receiveShadow = true;
scene.add(base);

const board = new THREE.Group();
scene.add(board);

const pieces = new THREE.Group();
scene.add(pieces);

const squares = [];

/* ============ إنشاء الرقعة ============ */
function makeBoard(){
 for(let rank = 8; rank >= 1; rank--){
  for(let f = 0; f < 8; f++){
   const s = files[f] + rank;
   const p = position(s);
   const mat = new THREE.MeshStandardMaterial({
    color: (rank + f) % 2 ? 0x936343 : 0xe9d2a5,
    roughness: .8
   });
   const mesh = new THREE.Mesh(new THREE.BoxGeometry(.99, .15, .99), mat);
   mesh.position.set(p.x, -.035, p.z);
   mesh.receiveShadow = true;
   mesh.userData.square = s;
   board.add(mesh);
   squares.push(mesh);
  }
 }
}

/* ============ تصميم الوحوش ============ */
function monster(type, color){
 const g = new THREE.Group();
 const main = new THREE.MeshStandardMaterial({
  color: color === "w" ? 0x28bca7 : 0x8552c9,
  roughness: .4, metalness: .1
 });
 const gold = new THREE.MeshStandardMaterial({ color: 0xffc857, metalness: .6, roughness: .3 });
 const white = new THREE.MeshStandardMaterial({ color: 0xffffff });
 const black = new THREE.MeshStandardMaterial({ color: 0x151515 });

 function sphere(x,y,z,sx,sy,sz,mat){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  g.add(m);
 }
 function cone(x,y,z,size,mat){
  const m = new THREE.Mesh(new THREE.ConeGeometry(size, .4, 12), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  g.add(m);
 }

 sphere(0, .45, 0, .34, .45, .32, main);
 sphere(0, .92, 0, .34, .35, .32, main);

 for(const x of [-.14, .14]){
  sphere(x, .99, .28, .105, .12, .06, white);
  sphere(x, 1, .33, .045, .06, .035, black);
 }
 for(const x of [-.38, .38]){
  sphere(x, .48, 0, .12, .2, .13, main);
 }

 if(type === "k"){
  cone(-.23, 1.35, 0, .16, gold);
  cone(.23, 1.35, 0, .16, gold);
  sphere(0, 1.38, 0, .32, .13, .3, gold);
 }
 if(type === "q"){
  for(let i = -1; i <= 1; i++) cone(i * .2, 1.35, 0, .13, gold);
  sphere(0, 1.35, 0, .3, .1, .3, gold);
 }
 if(type === "r"){
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(.3, .38, .25, 8), gold);
  crown.position.y = 1.3;
  crown.castShadow = true;
  g.add(crown);
 }
 if(type === "b") cone(0, 1.4, 0, .16, gold);
 if(type === "n"){
  sphere(0, 1.05, .3, .15, .2, .3, gold);
  cone(.1, 1.35, 0, .13, gold);
 }
 if(type === "p") sphere(0, 1.3, 0, .15, .16, .15, gold);

 return g;
}

/* ============ رسم القطع ============ */
function draw(){
 pieces.clear();
 const state = chess.board();
 for(let r = 0; r < 8; r++){
  for(let f = 0; f < 8; f++){
   const p = state[r][f];
   if(!p) continue;
   const s = files[f] + (8 - r);
   const pos = position(s);
   const obj = monster(p.type, p.color);
   obj.position.set(pos.x, .05, pos.z);
   obj.userData.square = s;
   obj.userData.color = p.color;
   pieces.add(obj);
  }
 }
 pieces.updateMatrixWorld(true);
}

function resetColors(){
 squares.forEach(s => {
  const rank = Number(s.userData.square[1]);
  const f = files.indexOf(s.userData.square[0]);
  s.material.color.setHex((rank + f) % 2 ? 0x936343 : 0xe9d2a5);
 });
}

function showMoves(from){
 resetColors();
 if(!from) return;
 const moves = chess.moves({ square: from, verbose: true });
 moves.forEach(m => {
  const sq = squares.find(x => x.userData.square === m.to);
  if(sq) sq.material.color.setHex(0x39dc83);
 });
}

function updateStatus(){
 const status = document.getElementById("status");
 if(chess.isCheckmate()){
  status.textContent = "🏆 كش مات! " + (chess.turn() === "w" ? "الأسود" : "الأبيض") + " فاز!";
  return true;
 }
 if(chess.isStalemate()){
  status.textContent = "🤝 تعادل بسبب الجمود!";
  return true;
 }
 if(chess.isDraw()){
  status.textContent = "🤝 المباراة انتهت بالتعادل";
  return true;
 }
 if(chess.isCheck()){
  status.textContent = "⚠️ كش! الملك مهدد";
  return false;
 }
 status.textContent = chess.turn() === "w" ? "دورك الآن - الأبيض" : "🤖 الكمبيوتر يفكر...";
 return false;
}

function saveMove(){
 snapshots.push({ fen: chess.fen(), history: [...chess.history()] });
}

function makeMove(from, to, promotion = "q"){
 try{
  const move = chess.move({ from, to, promotion });
  if(!move) return false;
  draw();
  resetColors();
  selected = null;
  document.getElementById("moves").textContent = chess.history().join("  ");
  sound();
  return true;
 }catch(e){ return false; }
}

/* ============ تقييم القطع ============ */
function evaluate(){
 if(chess.isCheckmate()) return chess.turn() === "w" ? -100000 : 100000;
 if(chess.isDraw()) return 0;
 const values = { p:100, n:320, b:330, r:500, q:900, k:20000 };
 let score = 0;
 chess.board().forEach((row, r) => {
  row.forEach((p, f) => {
   if(!p) return;
   let value = values[p.type];
   if(p.type === "p") value += (p.color === "b" ? r : 7 - r) * 4;
   const center = 7 - (Math.abs(3.5 - f) + Math.abs(3.5 - r));
   value += center * 2;
   score += p.color === "w" ? value : -value;
  });
 });
 return score;
}

function minimax(depth, alpha, beta, maximizing){
 if(depth === 0 || chess.isGameOver()) return evaluate();
 const moves = chess.moves();
 if(maximizing){
  let best = -Infinity;
  for(const m of moves){
   chess.move(m);
   best = Math.max(best, minimax(depth - 1, alpha, beta, false));
   chess.undo();
   alpha = Math.max(alpha, best);
   if(beta <= alpha) break;
  }
  return best;
 }else{
  let best = Infinity;
  for(const m of moves){
   chess.move(m);
   best = Math.min(best, minimax(depth - 1, alpha, beta, true));
   chess.undo();
   beta = Math.min(beta, best);
   if(beta <= alpha) break;
  }
  return best;
 }
}

/* ============ الكمبيوتر ============ */
function computer(){
 if(chess.isGameOver()) return;
 const moves = chess.moves();
 if(!moves.length) return;

 const level = document.getElementById("level").value;
 let chosen;

 if(level === "easy"){
  const captures = moves.filter(m => m.includes("x"));
  const pool = Math.random() < .5 && captures.length ? captures : moves;
  chosen = pool[Math.floor(Math.random() * pool.length)];
 }else{
  const depth = level === "medium" ? 1 : 2;
  let best = Infinity;
  for(const m of moves){
   chess.move(m);
   const score = minimax(depth, -Infinity, Infinity, true);
   chess.undo();
   if(score < best){
    best = score;
    chosen = m;
   }
  }
 }

 if(chosen){
  chess.move(chosen);
  draw();
  document.getElementById("moves").textContent = chess.history().join("  ");
  sound();
  updateStatus();
 }
}

function executePlayerMove(from, to, promotion){
 if(!makeMove(from, to, promotion)) return;
 document.getElementById("promotion").style.display = "none";
 if(updateStatus()) return;

 thinking = true;
 setTimeout(() => {
  if(gameStarted && !chess.isGameOver()){
   computer();
   updateStatus();
  }
  thinking = false;
 }, 350);
}

/* ============ معالجة النقر ============ */
function onClick(event){
 if(!gameStarted || thinking || chess.isGameOver() || pendingPromotion) return;
 if(chess.turn() !== "w") return;

 const rect = renderer.domElement.getBoundingClientRect();
 const pointer = new THREE.Vector2(
  ((event.clientX - rect.left) / rect.width) * 2 - 1,
  -((event.clientY - rect.top) / rect.height) * 2 + 1
 );
 const ray = new THREE.Raycaster();
 ray.setFromCamera(pointer, camera);

 const pieceHits = ray.intersectObjects(pieces.children, true);
 let clickedSquare = null;

 if(pieceHits.length > 0){
  let obj = pieceHits[0].object;
  while(obj && !obj.userData.square){ obj = obj.parent; }
  if(obj) clickedSquare = obj.userData.square;
 }

 if(!clickedSquare){
  const squareHits = ray.intersectObjects(squares, false);
  if(squareHits.length > 0) clickedSquare = squareHits[0].object.userData.square;
 }

 if(!clickedSquare) return;

 if(selected){
  const moves = chess.moves({ square: selected, verbose: true });
  const move = moves.find(m => m.to === clickedSquare);
  if(move){
   if(move.promotion){
    pendingPromotion = { from: selected, to: clickedSquare };
    document.getElementById("promotion").style.display = "block";
    return;
   }
   saveMove();
   executePlayerMove(selected, clickedSquare);
   return;
  }
  const targetPiece = chess.get(clickedSquare);
  if(targetPiece && targetPiece.color === "w"){
   selected = clickedSquare;
   showMoves(selected);
   sound();
   return;
  }
  selected = null;
  resetColors();
  return;
 }

 const piece = chess.get(clickedSquare);
 if(piece && piece.color === "w"){
  selected = clickedSquare;
  showMoves(selected);
  sound();
 }
}

/* ============ دوال التحكم العامة ============ */
window.startGame = function(level){
 sound();
 closeDifficulty();
 if(level){
  document.getElementById("level").value = level;
 }

 document.getElementById("menuScreen").style.display = "none";
 document.getElementById("gameScreen").style.display = "block";
 gameStarted = true;

 if(!initialized){
  makeBoard();
  initialized = true;
 }

 window.newGame();
 setTimeout(onResize, 100);
};

window.backMenu = function(){
 sound();
 gameStarted = false;
 thinking = false;
 pendingPromotion = null;
 selected = null;
 document.getElementById("promotion").style.display = "none";
 document.getElementById("gameScreen").style.display = "none";
 document.getElementById("menuScreen").style.display = "block";
};

window.newGame = function(){
 sound();
 chess.reset();
 snapshots = [];
 selected = null;
 pendingPromotion = null;
 thinking = false;
 document.getElementById("promotion").style.display = "none";
 document.getElementById("moves").textContent = "سجل الحركات سيظهر هنا";
 resetColors();
 draw();
 updateStatus();
};

window.undoMove = function(){
 if(!gameStarted || thinking || pendingPromotion) return;
 if(snapshots.length === 0){
  notice("لا توجد حركات للتراجع عنها");
  return;
 }
 const snap = snapshots.pop();
 try{ chess.load(snap.fen); }catch(e){ return; }
 selected = null;
 pendingPromotion = null;
 document.getElementById("promotion").style.display = "none";
 resetColors();
 draw();
 document.getElementById("moves").textContent = snap.history.length ? snap.history.join("  ") : "سجل الحركات سيظهر هنا";
 updateStatus();
 sound();
};

window.promote = function(piece){
 if(!pendingPromotion) return;
 sound();
 const { from, to } = pendingPromotion;
 pendingPromotion = null;
 document.getElementById("promotion").style.display = "none";
 saveMove();
 executePlayerMove(from, to, piece);
};

/* ============ الحجم وحلقة العرض ============ */
function onResize(){
 const w = holder.clientWidth;
 const h = holder.clientHeight;
 if(w === 0 || h === 0){
  renderer.setSize(800, 500);
  camera.aspect = 800 / 500;
  camera.updateProjectionMatrix();
  return;
 }
 camera.aspect = w / h;
 camera.updateProjectionMatrix();
 renderer.setSize(w, h);
}

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene, camera);
}

/* ============ التهيئة ============ */
renderer.setSize(800, 500);
window.addEventListener("resize", onResize);

let downX = 0, downY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => {
 downX = e.clientX;
 downY = e.clientY;
});
renderer.domElement.addEventListener("pointerup", (e) => {
 const dx = e.clientX - downX;
 const dy = e.clientY - downY;
 if(Math.sqrt(dx * dx + dy * dy) < 10){
  onClick(e);
 }
});

animate();
</script>
