<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --wood-light: #e6c29a;
        --wood-dark: #8b5a2b;
        --wood-border: #4a2c11;
        --bg-color: #112b2b;
        --gold: #ffd700;
        --font-main: 'Cairo', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    body {
        font-family: var(--font-main);
        background: radial-gradient(circle at center, #1e3b3b 0%, #0a1414 100%);
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        color: white;
        position: relative;
    }

    /* ================= الشريط العلوي ================= */
    .top-bar {
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, #5c3a21, #3e1f0b);
        border-bottom: 3px solid var(--gold);
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        height: 90px;
    }

    /* شريط الإعدادات الأحمر */
    .settings-ribbon {
        background: linear-gradient(to bottom, #d32f2f, #b71c1c);
        width: 50px;
        height: 70px;
        position: absolute;
        top: 0;
        left: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 85%, 0 100%);
        cursor: pointer;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        transition: transform 0.2s;
    }
    .settings-ribbon:active { transform: scale(0.95); }
    .settings-ribbon span {
        font-size: 24px;
        margin-bottom: 10px;
        filter: drop-shadow(0 2px 2px #000);
    }

    .level-info {
        text-align: center;
        flex: 1;
        margin-left: 60px;
    }
    .level-info h2 {
        color: var(--gold);
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 2px;
    }
    .level-info p {
        color: #fff;
        font-size: 14px;
        font-weight: 700;
    }

    .profile-pic {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid var(--gold);
        background: #000;
        overflow: hidden;
        box-shadow: 0 0 15px rgba(255,215,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .profile-pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* ================= منطقة اللعب ================= */
    .board-container {
        flex: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5;
    }

    #game {
        width: 100%;
        height: 100%;
        touch-action: none;
    }

    /* السهم الذهبي (تخطي) */
    .skip-arrow {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 40px;
        color: var(--gold);
        filter: drop-shadow(0 0 10px rgba(255,215,0,0.8));
        cursor: pointer;
        z-index: 10;
        animation: float 2s infinite ease-in-out;
    }

    /* ================= الشريط السفلي ================= */
    .bottom-bar {
        position: relative;
        z-index: 10;
        background: linear-gradient(to top, #0a1414, #112b2b);
        padding: 15px 10px 25px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid rgba(255,215,0,0.2);
    }

    .action-btn-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .action-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #5c3a21, #2c1503);
        border: 3px solid var(--gold);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 26px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.3);
        position: relative;
        transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.9); }
    
    .action-btn-wrapper span {
        font-size: 12px;
        font-weight: 700;
        color: #ddd;
    }

    /* شارة العد التنازلي */
    .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #e63946;
        color: #fff;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 900;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #fff;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    /* ================= النوافذ ================= */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(5px);
        z-index: 100;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }
    .modal-content {
        background: linear-gradient(135deg, #2c1503, #4a2c11);
        border: 3px solid var(--gold);
        border-radius: 20px;
        width: 90%;
        max-width: 380px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        text-align: center;
    }
    .modal-content h2 {
        color: var(--gold);
        margin-bottom: 20px;
        font-size: 22px;
    }
    .btn-wood {
        width: 100%;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 15px;
        border: 2px solid var(--gold);
        background: linear-gradient(to bottom, #8b5a2b, #4a2c11);
        color: white;
        font-family: inherit;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-wood:active { transform: scale(0.95); }

    #promotion {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(44, 21, 3, 0.95);
        border: 3px solid var(--gold);
        border-radius: 20px;
        padding: 20px;
        z-index: 50;
        text-align: center;
        box-shadow: 0 0 30px #000;
        width: 280px;
    }
    #promotion strong {
        display: block;
        color: var(--gold);
        margin-bottom: 15px;
        font-size: 16px;
    }
    .promo-btns {
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .promo-btns button {
        width: 50px;
        height: 50px;
        border-radius: 10px;
        border: 2px solid var(--gold);
        background: #8b5a2b;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

</style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="top-bar">
        <div class="settings-ribbon" onclick="openModal('settings')">
            <span>⚙️</span>
        </div>
        <div class="level-info">
            <h2>المستوى 1</h2>
            <p>مبتدئ</p>
        </div>
        <div class="profile-pic">
            <!-- صورة افتراضية للخصم -->
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=transparent" alt="الخصم">
        </div>
    </header>

    <!-- منطقة اللعب -->
    <div class="board-container">
        <div class="skip-arrow">⏩</div>
        <div id="game"></div>
        
        <!-- نافذة ترقية البيدق -->
        <div id="promotion">
            <strong>👑 اختر الترقية</strong>
            <div class="promo-btns">
                <button onclick="promote('q')">♕</button>
                <button onclick="promote('r')">♖</button>
                <button onclick="promote('b')">♗</button>
                <button onclick="promote('n')">♘</button>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي (أزرار التحكم) -->
    <footer class="bottom-bar">
        <div class="action-btn-wrapper" onclick="showToast('تلميح: حاول السيطرة على الوسط')">
            <div class="action-btn">
                💡
                <div class="badge">5</div>
            </div>
            <span>تلميح</span>
        </div>

        <div class="action-btn-wrapper" onclick="undoMove()">
            <div class="action-btn">↩️</div>
            <span>تراجع</span>
        </div>

        <div class="action-btn-wrapper" onclick="showToast('تم الاستسلام')">
            <div class="action-btn">🏰</div>
            <span>القطع</span>
        </div>

        <div class="action-btn-wrapper" onclick="newGame()">
            <div class="action-btn">🔄</div>
            <span>البدء من جديد</span>
        </div>
    </footer>

    <!-- نافذة الإعدادات -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-content">
            <h2>⚙️ الإعدادات</h2>
            <button class="btn-wood" onclick="closeModal('settings')">حفظ وإغلاق</button>
        </div>
    </div>

    <!-- استيراد المكتبات -->
    <script type="importmap">
    {
     "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm"
     }
    }
    </script>

    <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { Chess } from "chess";

    /* ============ الحالة ============ */
    const chess = new Chess();
    let selected = null;
    let thinking = false;
    let pendingPromotion = null;
    let snapshots = [];
    
    let scene, camera, renderer, controls, boardGroup, piecesGroup, squares = [];
    const files = "abcdefgh";

    // مصفوفات لتخزين الماسات الخضراء
    let moveIndicators = [];
    let selectedHighlight = null;

    /* ============ الإعدادات الابتدائية ============ */
    window.openModal = (id) => document.getElementById('modal-'+id).classList.add('active');
    window.closeModal = (id) => document.getElementById('modal-'+id).classList.remove('active');

    let toastTimer;
    window.showToast = function(msg) {
        // Toast بسيط
        let t = document.getElementById('toast');
        if(!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#2c1503;color:#ffd700;padding:10px 20px;border-radius:20px;border:2px solid #ffd700;font-weight:bold;z-index:999;transition:0.3s;';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = 1;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.style.opacity = 0, 2000);
    };

    /* ============ التهيئة ============ */
    function init() {
        const holder = document.getElementById("game");
        
        scene = new THREE.Scene();
        
        // كاميرا عمودية قليلاً لتبدو كالصورة
        camera = new THREE.PerspectiveCamera(45, holder.clientWidth / holder.clientHeight, 0.1, 100);
        camera.position.set(0, 9.5, 9.5);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(holder.clientWidth, holder.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        holder.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 8;
        controls.maxDistance = 15;
        controls.maxPolarAngle = Math.PI / 2.2;

        // إضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 2.5);
        dirLight.position.set(5, 12, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xaaccff, 1);
        fillLight.position.set(-5, 8, -5);
        scene.add(fillLight);

        boardGroup = new THREE.Group();
        piecesGroup = new THREE.Group();
        scene.add(boardGroup);
        scene.add(piecesGroup);

        createBoard();
        drawPieces();
        animate();

        window.addEventListener('resize', onResize);
        
        // أحداث اللمس
        let downX = 0, downY = 0;
        renderer.domElement.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; });
        renderer.domElement.addEventListener("pointerup", e => {
            if(Math.hypot(e.clientX - downX, e.clientY - downY) < 10) onClick(e);
        });
    }

    /* ============ إنشاء الرقعة (بدون قاعدة) ============ */
    function createBoard() {
        // إطار خشبي محيط
        const frameGeo = new THREE.BoxGeometry(8.6, 0.2, 8.6);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.y = -0.1;
        frame.receiveShadow = true;
        boardGroup.add(frame);

        // المربعات
        for(let rank=8; rank>=1; rank--) {
            for(let f=0; f<8; f++) {
                const s = files[f] + rank;
                const x = files.indexOf(s[0]) - 3.5;
                const z = Number(s[1]) - 4.5;
                
                const isDark = (rank + f) % 2 === 0;
                const color = isDark ? 0x3a2a1a : 0xe6c29a; // ألوان خشبية

                const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
                const geo = new THREE.BoxGeometry(1, 0.1, 1);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, -0.05, z);
                mesh.receiveShadow = true;
                mesh.userData.square = s;
                boardGroup.add(mesh);
                squares.push(mesh);
            }
        }
    }

    /* ============ إنشاء قطع الشطرنج الكلاسيكية ============ */
    function createPiece(type, color) {
        const g = new THREE.Group();
        
        // مواد واقعية
        const isWhite = color === 'w';
        const matBase = new THREE.MeshStandardMaterial({ 
            color: isWhite ? 0xf0e6d2 : 0x2b2b2b, 
            metalness: isWhite ? 0.1 : 0.6, 
            roughness: isWhite ? 0.4 : 0.3 
        });

        // دالة مساعدة لصنع أسطوانة
        const addCyl = (rTop, rBot, h, y, mat=matBase) => {
            const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 32), mat);
            m.position.y = y;
            m.castShadow = true;
            m.receiveShadow = true;
            g.add(m);
        };

        // دالة مساعدة لصنع كرة
        const addSph = (r, y, mat=matBase) => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32), mat);
            m.position.y = y;
            m.castShadow = true;
            m.receiveShadow = true;
            g.add(m);
        };

        // تصميم القطع
        if (type === 'p') { // بيدق
            addCyl(0.25, 0.3, 0.15, 0.075); // قاعدة
            addCyl(0.1, 0.2, 0.3, 0.3); // جسم
            addSph(0.15, 0.55); // رأس
        } 
        else if (type === 'r') { // قلعة
            addCyl(0.3, 0.35, 0.15, 0.075);
            addCyl(0.22, 0.25, 0.4, 0.35);
            addCyl(0.3, 0.3, 0.15, 0.6); // التاج
            // فتحات التاج
            for(let i=0; i<4; i++) {
                const box = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), matBase);
                const angle = (i * Math.PI/2) + Math.PI/4;
                box.position.set(Math.cos(angle)*0.2, 0.65, Math.sin(angle)*0.2);
                box.castShadow = true;
                g.add(box);
            }
        }
        else if (type === 'n') { // حصان
            addCyl(0.3, 0.35, 0.15, 0.075);
            addCyl(0.2, 0.25, 0.3, 0.3);
            // رقبة ورأس
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.3), matBase);
            head.position.set(0, 0.55, 0.05);
            head.rotation.x = -0.4;
            head.castShadow = true;
            g.add(head);
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.25), matBase);
            snout.position.set(0, 0.65, 0.2);
            snout.rotation.x = -0.2;
            snout.castShadow = true;
            g.add(snout);
        }
        else if (type === 'b') { // فيل
            addCyl(0.28, 0.32, 0.15, 0.075);
            addCyl(0.12, 0.22, 0.4, 0.35);
            addSph(0.15, 0.6);
            const tip = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.2, 32), matBase);
            tip.position.y = 0.75;
            tip.castShadow = true;
            g.add(tip);
        }
        else if (type === 'q') { // ملكة
            addCyl(0.32, 0.36, 0.15, 0.075);
            addCyl(0.15, 0.28, 0.5, 0.4);
            addCyl(0.25, 0.2, 0.15, 0.7); // التاج
            // كرات التاج
            for(let i=0; i<6; i++) {
                const angle = (i * Math.PI/3);
                const sph = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), matBase);
                sph.position.set(Math.cos(angle)*0.2, 0.78, Math.sin(angle)*0.2);
                sph.castShadow = true;
                g.add(sph);
            }
            addSph(0.1, 0.82); // الكرة العلوية
        }
        else if (type === 'k') { // ملك
            addCyl(0.32, 0.36, 0.15, 0.075);
            addCyl(0.15, 0.28, 0.55, 0.42);
            addCyl(0.22, 0.22, 0.1, 0.75); // تاج
            // الصليب
            const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), matBase);
            c1.position.y = 0.9;
            c1.castShadow = true;
            g.add(c1);
            const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.08, 0.08), matBase);
            c2.position.y = 0.92;
            c2.castShadow = true;
            g.add(c2);
        }

        return g;
    }

    /* ============ رسم القطع ============ */
    function drawPieces() {
        piecesGroup.clear();
        const state = chess.board();
        for(let r=0; r<8; r++) {
            for(let f=0; f<8; f++) {
                const p = state[r][f];
                if(!p) continue;
                const s = files[f] + (8 - r);
                const x = files.indexOf(s[0]) - 3.5;
                const z = Number(s[1]) - 4.5;
                
                const obj = createPiece(p.type, p.color);
                obj.position.set(x, 0.05, z);
                obj.userData.square = s;
                obj.userData.color = p.color;
                piecesGroup.add(obj);
            }
        }
        piecesGroup.updateMatrixWorld(true);
    }

    /* ============ التمييز (الماسات الخضراء) ============ */
    function clearHighlights() {
        if(selectedHighlight) {
            boardGroup.remove(selectedHighlight);
            selectedHighlight = null;
        }
        moveIndicators.forEach(m => boardGroup.remove(m));
        moveIndicators = [];
    }

    function showMoves(from) {
        clearHighlights();
        if(!from) return;

        // تمييز المربع المحدد
        const p = getPos(from);
        const selGeo = new THREE.PlaneGeometry(0.95, 0.95);
        const selMat = new THREE.MeshBasicMaterial({ color: 0x39dc83, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
        selectedHighlight = new THREE.Mesh(selGeo, selMat);
        selectedHighlight.rotation.x = -Math.PI / 2;
        selectedHighlight.position.set(p.x, 0.02, p.z);
        boardGroup.add(selectedHighlight);

        // الماسات للحركات المتاحة
        const moves = chess.moves({ square: from, verbose: true });
        moves.forEach(m => {
            const pos = getPos(m.to);
            const geo = new THREE.PlaneGeometry(0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({ color: 0x39dc83, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.rotation.z = Math.PI / 4; // شكل ماسة
            mesh.position.set(pos.x, 0.02, pos.z);
            boardGroup.add(mesh);
            moveIndicators.push(mesh);
        });
    }

    function getPos(square) {
        return {
            x: files.indexOf(square[0]) - 3.5,
            z: Number(square[1]) - 4.5
        };
    }

    /* ============ منطق اللعبة ============ */
    function onClick(event) {
        if(thinking || chess.isGameOver() || pendingPromotion) return;
        if(chess.turn() !== "w") return;

        const rect = renderer.domElement.getBoundingClientRect();
        const pointer = new THREE.Vector2(
            ((event.clientX - rect.left) / rect.width) * 2 - 1,
            -((event.clientY - rect.top) / rect.height) * 2 + 1
        );
        const ray = new THREE.Raycaster();
        ray.setFromCamera(pointer, camera);

        // البحث عن قطع
        const pieceHits = ray.intersectObjects(piecesGroup.children, true);
        let clickedSquare = null;

        if(pieceHits.length > 0) {
            let obj = pieceHits[0].object;
            while(obj && !obj.userData.square) obj = obj.parent;
            if(obj) clickedSquare = obj.userData.square;
        }

        // البحث عن مربعات
        if(!clickedSquare) {
            const squareHits = ray.intersectObjects(squares, false);
            if(squareHits.length > 0) clickedSquare = squareHits[0].object.userData.square;
        }

        if(!clickedSquare) return;

        if(selected) {
            const moves = chess.moves({ square: selected, verbose: true });
            const move = moves.find(m => m.to === clickedSquare);
            
            if(move) {
                if(move.promotion) {
                    pendingPromotion = { from: selected, to: clickedSquare };
                    document.getElementById("promotion").style.display = "block";
                    return;
                }
                saveMove();
                executePlayerMove(selected, clickedSquare);
                return;
            }
            
            // اختيار قطعة أخرى
            const targetPiece = chess.get(clickedSquare);
            if(targetPiece && targetPiece.color === "w") {
                selected = clickedSquare;
                showMoves(selected);
                return;
            }
            
            selected = null;
            clearHighlights();
            return;
        }

        const piece = chess.get(clickedSquare);
        if(piece && piece.color === "w") {
            selected = clickedSquare;
            showMoves(selected);
        }
    }

    function executePlayerMove(from, to, promotion) {
        try {
            chess.move({ from, to, promotion });
            drawPieces();
            clearHighlights();
            selected = null;
            
            if(updateStatus()) return;

            thinking = true;
            setTimeout(() => {
                if(!chess.isGameOver()) {
                    computerMove();
                    updateStatus();
                }
                thinking = false;
            }, 400);
        } catch(e) {}
    }

    function computerMove() {
        const moves = chess.moves();
        if(!moves.length) return;
        // ذكاء اصطناعي بسيط (عشوائي مع تفضيل الأكل)
        const captures = moves.filter(m => m.includes("x"));
        const pool = Math.random() < 0.6 && captures.length ? captures : moves;
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        
        chess.move(chosen);
        drawPieces();
    }

    function updateStatus() {
        if(chess.isCheckmate()) {
            showToast("🏆 كش مات! " + (chess.turn() === "w" ? "الأسود فاز" : "الأبيض فاز"));
            return true;
        }
        if(chess.isDraw() || chess.isStalemate()) {
            showToast("🤝 تعادل");
            return true;
        }
        return false;
    }

    function saveMove() {
        snapshots.push(chess.fen());
    }

    window.undoMove = function() {
        if(snapshots.length === 0) return showToast("لا توجد حركات");
        chess.load(snapshots.pop());
        drawPieces();
        clearHighlights();
        selected = null;
    };

    window.newGame = function() {
        chess.reset();
        snapshots = [];
        selected = null;
        pendingPromotion = null;
        document.getElementById("promotion").style.display = "none";
        drawPieces();
        clearHighlights();
    };

    window.promote = function(piece) {
        if(!pendingPromotion) return;
        const { from, to } = pendingPromotion;
        pendingPromotion = null;
        document.getElementById("promotion").style.display = "none";
        saveMove();
        executePlayerMove(from, to, piece);
    };

    /* ============ حلقة العرض ============ */
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function onResize() {
        const holder = document.getElementById("game");
        if(!holder || !camera || !renderer) return;
        camera.aspect = holder.clientWidth / holder.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(holder.clientWidth, holder.clientHeight);
    }

    // تشغيل اللعبة
    init();

    </script>
</body>
</html>
